name: PR discipline

on:
  pull_request:

permissions:
  contents: read

jobs:
  task-id:
    name: Require MVP task ID
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Validate task reference
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" |
            grep -Eq 'M[0-9]+-H[0-9]{2}-[A-Z][A-Z0-9]*-[0-9]{2}'
