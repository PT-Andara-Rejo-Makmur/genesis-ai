name: Kualitas GENESIS

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genesis-ai
    steps:
      - name: Checkout GENESIS repository
        uses: actions/checkout@v4
        with:
          path: genesis-ai

      - name: Checkout canonical contracts
        uses: actions/checkout@v4
        with:
          repository: PT-Andara-Rejo-Makmur/alos-contracts
          ref: development
          path: alos-contracts
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Checkout Backend authority implementation
        uses: actions/checkout@v4
        with:
          repository: PT-Andara-Rejo-Makmur/alos-backend
          ref: development
          path: alos-backend
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: genesis-ai/pyproject.toml

      - name: Pasang dependency dan framework adapter
        run: python -m pip install -e ../alos-backend -e ".[dev,frameworks]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest dan architecture checks
        run: pytest

      - name: Uji import aplikasi
        run: python -c "from genesis.main import app; assert app.title == 'GENESIS AI Control Plane'"
